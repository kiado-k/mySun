<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Vocabulary Learning Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header style="margin-top: 5rem;">
      <h1>Vocabulary Engine</h1>
      <p style="color: var(--text-sub); font-size: 1.1rem;">당신만을 위한 맞춤형 이미지 기반 어휘 학습 시스템</p>
    </header>

    <div class="hub-container">
      <!-- 단어 모음 (Library/Explorer) -->
      <a href="collection.html" class="hub-card">
        <div class="hub-icon">📚</div>
        <div>
          <h2>단어 모음</h2>
          <p>전체 어휘 목록을 조회하고 필터링하세요.</p>
        </div>
      </a>

      <!-- 학습 시작하기 (Quiz) -->
      <a href="quiz.html" class="hub-card">
        <div class="hub-icon">🎮</div>
        <div>
          <h2>이미지 퀴즈</h2>
          <p>이미지를 보고 정답을 맞추는 재미있는 퀴즈!</p>
        </div>
      </a>
    </div>

    <div class="welcome-section">
      <p style="font-weight: 600; color: var(--accent-color);">✨ 안내: 모든 음성 지원 기능(TTS)과 효과음이 완벽하게 지원됩니다.</p>
    </div>
  </div>

</html>
