<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 퀴즈 - 단어 학습</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 🔥 퀴즈 전용 스타일 추가 */
    .quiz-layout {
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
      margin-top: 3rem;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem 2rem;
      border-radius: 1rem;
    }
    .image-container {
      width: 80%;
      aspect-ratio: 1/1;
      max-width: 280px; /* 🔥 단어모음 카드와 비슷한 280px로 최종 최적화 */
      margin: 0 auto;
      background: #f8fafc;
      border-radius: 1.2rem;
      overflow: hidden;
      border: 3px solid #334155;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #quizImage {
      width: 100%; height: 100%;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast; 
    }
    
    /* 🔊 스피커 아이콘 스타일 (장식용) */
    .speaker-indicator {
      position: absolute; top: 10px; right: 10px;
      width: 32px; height: 32px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(5px);
      border-radius: 50%; border: 1px solid rgba(0,0,0,0.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; pointer-events: none; /* ✨ 클릭 방지 (이미지 클릭 유도) */
      opacity: 0.8; z-index: 5;
    }
    .options-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      max-width: 500px;
      margin: 0 auto;
    }
    .quiz-btn {
      padding: 1.2rem 0.5rem;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 1rem;
      background: var(--card-bg);
      border: 2px solid #334155;
      color: white;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      min-width: 0; /* ✨ 모바일에서 텍스트 넘침 방지 */
    }
    .quiz-btn:hover {
      background: var(--primary-color);
      border-color: var(--primary-color);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
    }
    
    /* 📊 결과 화면 스타일 */
    #resultScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-color);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1001; padding: 2rem;
    }
    .result-card {
      background: var(--card-bg);
      padding: 3rem; border-radius: 2rem; text-align: center;
      max-width: 500px; width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .result-stat { font-size: 1.2rem; margin-bottom: 1rem; color: var(--text-sub); }
    .result-stat span { font-weight: bold; color: var(--accent-color); font-size: 1.5rem; }
    
    /* 🎉 피드백 애니메이션 제거 (버튼 피드백으로 대체) */
    .feedback-toast {
      position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
      padding: 1rem 2.5rem; border-radius: 5rem; color: white; font-weight: bold;
      z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      font-size: 1.2rem; white-space: nowrap; display: flex; align-items: center; gap: 8px;
    }
    .feedback-toast.active { opacity: 1; top: 22%; }
    .feedback-toast.correct { background: #059669; box-shadow: 0 5px 15px rgba(5,150,105,0.3); }
    .feedback-toast.wrong { background: #dc2626; box-shadow: 0 5px 15px rgba(220,38,38,0.3); }

    /* 📱 디바이스 최적화 (Responsive Design) */
    @media (max-width: 480px) {
      .quiz-layout { margin-top: 1.5rem; }
      .image-container { max-width: 220px; margin-bottom: 1.5rem; width: 85%; }
      .options-row { gap: 0.8rem; }
      .quiz-btn { font-size: 1rem; padding: 1rem; border-radius: 0.8rem; }
      .stats-bar { padding: 0.8rem 1rem; font-size: 0.9rem; }
      h1 { font-size: 1.8rem; }
      .feedback-overlay { font-size: 6rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header style="display: flex; flex-direction: column; gap: 1rem; align-items: center; margin-top: 1.5rem;">
      <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" style="color: var(--accent-color); text-decoration: none; font-weight: bold; font-size: 0.95rem;">← 이전으로</a>
        <h1 style="margin: 0; font-size: 1.8rem;">Quiz</h1>
        <button id="quitBtn" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; padding: 0.4rem 0.8rem; border-radius: 0.5rem; cursor: pointer;">학습 종료</button>
      </div>
      
      <!-- 🌐 한/영 모드 단일 토글 (A <-> 가) -->
      <div style="display: flex; align-items: center; justify-content: center; width: 100%;">
        <button id="langToggleBtn" class="premium-toggle" onclick="toggleQuizMode()">
          <span id="langText">영어 모드 (Eng)</span>
          <span style="margin-left:8px; opacity:0.5;">⇄</span>
        </button>
      </div>
    </header>

    <style>
      .premium-toggle {
        padding: 0.6rem 1.2rem; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.05); color: var(--accent-color); font-weight: bold;
        cursor: pointer; transition: all 0.3s; display: flex; align-items: center;
      }
      .premium-toggle:hover {
        background: rgba(255,255,255,0.1); border-color: var(--primary-color);
      }
      
      /* ✨ 버튼 피드백 스타일 */
      .quiz-btn.correct-choice {
        background: #059669 !important; border-color: #10b981 !important;
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
      }
      .quiz-btn.wrong-choice {
        background: #dc2626 !important; border-color: #ef4444 !important;
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        animation: shake 0.4s;
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
    </style>

    <div class="quiz-layout">
      <!-- 상태 표시줄 -->
      <div class="stats-bar">
        <div id="statusMsg" style="font-weight: bold; color: var(--accent-color);">이미지를 보고 단어를 맞춰보세요!</div>
        <div id="scoreText">맞춘 개수: <span id="correctCount" style="color: var(--primary-color);">0</span></div>
      </div>

      <!-- 이미지 영역 (클릭 시 음성 재생) -->
      <div class="image-container" style="position: relative; cursor: pointer;" onclick="replayVoice()">
        <img id="quizImage" src="" alt="Quiz Image">
        <div class="speaker-indicator">🔊</div>
      </div>

      <!-- 2지 선다 버튼 -->
      <div class="options-row">
        <button class="quiz-btn" id="btn1">Option 1</button>
        <button class="quiz-btn" id="btn2">Option 2</button>
      </div>
    </div>
  </div>

  <div id="feedbackToast" class="feedback-toast">정답!</div>

  <!-- 📊 결과 시트 (통계 포함) -->
  <div id="resultScreen">
    <div class="result-card">
      <h2 style="font-size: 2.2rem; margin-bottom: 2rem; color: var(--primary-color);">학습 완료!</h2>
      <div id="statsSummary">
        <div class="result-stat">총 풀이 시간: <span id="finalTime">0s</span></div>
        <div class="result-stat">총 시도 횟수: <span id="finalTotal">0</span></div>
        <div class="result-stat">성공률: <span id="finalSuccessRate">0%</span></div>
      </div>
      <button class="quiz-btn" style="margin-top: 2rem; width: 100%; border-radius: 1rem;" onclick="location.href='index.html'">메인 허브로 가기</button>
    </div>
  </div>

  <script src="quiz_app.js"></script>
</body>
</html>
