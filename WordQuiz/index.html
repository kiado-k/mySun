<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashLearn - 스마트 어휘 암기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- 초기 설정 화면 -->
    <div id="setupScreen" class="screen active">
      <header class="hero-header">
        <h1>Word<span>Quiz</span></h1>
        <p>제한 시간 내에 올바른 뜻을 맞혀보세요!</p>
      </header>
      
      <div class="selection-box">
        <div class="form-group">
          <label>대분류 (Level 1)</label>
          <select id="l1Filter">
            <option value="all">전체 (All)</option>
          </select>
        </div>

        <div class="form-group">
          <label>중분류 (Level 2)</label>
          <select id="l2Filter">
            <option value="all">전체 (All)</option>
          </select>
        </div>

        <div class="form-group">
          <label>소분류 (Level 3)</label>
          <select id="l3Filter">
            <option value="all">전체 (All)</option>
          </select>
        </div>

        <button id="startStudy" class="primary-btn pulse">퀴즈 시작하기</button>
      </div>
    </div>

    <!-- 퀴즈 화면 -->
    <div id="studyScreen" class="screen">
      <div class="study-nav">
        <button id="quitBtn" class="danger-btn">종료</button>
        <div class="timer-container">
          <div class="timer-text-wrapper">
            <span id="timerText">10</span><span class="timer-unit">s</span>
          </div>
          <div id="timerBar" class="timer-bar"></div>
        </div>
        <div class="score-badge">정답 <span id="currentScore">0 / 0</span></div>
      </div>

      <div class="quiz-container">
        <div class="question-box">
          <div id="questionText" class="question-text">Question</div>
        </div>

        <div id="optionsGrid" class="options-grid">
          <!-- 4개 선택지 동적 생성 -->
        </div>
      </div>
      
      <div id="feedbackOverlay" class="feedback-overlay">
        <div class="feedback-content">
          <span id="feedbackIcon"></span>
          <span id="feedbackMsg"></span>
        </div>
      </div>
    </div>

    <!-- 결과 화면 -->
    <div id="resultScreen" class="screen">
      <div class="result-card">
        <h2>📊 퀴즈 결과</h2>
        <div class="stat-grid">
          <div class="stat-item">
            <span class="stat-val" id="finalTotal">0</span>
            <span class="stat-label">총 문제</span>
          </div>
          <div class="stat-item">
            <span class="stat-val success" id="finalCorrect">0</span>
            <span class="stat-label">정답</span>
          </div>
          <div class="stat-item">
            <span class="stat-val danger" id="finalWrong">0</span>
            <span class="stat-label">오답</span>
          </div>
          <div class="stat-item">
            <span class="stat-val" id="finalSuccessRate">0%</span>
            <span class="stat-label">정답률</span>
          </div>
          <div class="stat-item">
            <span class="stat-val" id="finalTime">0s</span>
            <span class="stat-label">소요 시간</span>
          </div>
        </div>

        <div id="wrongListContainer" class="wrong-list-box" style="display: none;">
          <h3>❌ 틀린 단어 목록</h3>
          <div id="wrongList" class="wrong-list">
            <!-- 틀린 단어들 동적 생성 -->
          </div>
        </div>

        <button id="restartBtn" class="primary-btn">메인으로</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
